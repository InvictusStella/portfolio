# Builds the site and publishes it to GitHub Pages.
# If any step fails, nothing is deployed and the live site stays as it was.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # Rebuild daily so repos you tag/untag "portfolio" on GitHub show up without a push.
  # (Cron times are UTC. An odd minute avoids the busy top of the hour.)
  schedule:
    - cron: '17 3 * * *'

# The minimum access this workflow needs: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # End-to-end smoke test in a real browser, against a build that uses sample
      # projects (so there are always stars to test, whatever is tagged on GitHub).
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Build with sample projects
        run: npm run build
        env:
          PROJECTS: sample

      - name: End-to-end smoke test
        run: npm run test:e2e

      # The real build, with your projects from GitHub. This is what gets deployed.
      - name: Build
        run: npm run build
        env:
          # The token every workflow run gets automatically: lets the build read your
          # public repos with a higher rate limit. Nothing to set up.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The real build can look different from the sample one (e.g. no tagged repos yet),
      # so check it loads without errors too before deploying it.
      - name: Check the real build loads without errors
        run: npx playwright test -g "without errors"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
